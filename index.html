<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/navilo-logo.svg" />
    <link rel="shortcut icon" href="/navilo-logo.svg" />
    <link rel="apple-touch-icon" href="/navilo-logo.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/src/invoicePrintPreference.css" />
    <link rel="stylesheet" href="/src/naviloToolbarOverrides.css" />
    <title>ERP</title>
  </head>
  <body>
    <div id="root">
      <div id="navilo-boot-fallback" style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:#f6f7f9;color:#475569;font:500 14px Inter,Arial,sans-serif">
        Loading NAVILO…
      </div>
    </div>
    <script>
      window.__NAVILO_BOOT_STARTED__ = Date.now();
      window.addEventListener("error", function () {
        window.setTimeout(function () {
          var root = document.getElementById("root");
          if (root && !root.querySelector("[data-navilo-react-mounted]")) {
            root.innerHTML = '<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:#f6f7f9;padding:24px;font:500 14px Arial,sans-serif;color:#334155"><div style="max-width:520px;border:1px solid #fecaca;background:#fff;padding:18px;border-radius:10px"><strong style="display:block;color:#991b1b;margin-bottom:8px">NAVILO could not start</strong><span>Please reload the page. If this remains visible, the application startup file failed to load.</span></div></div>';
          }
        }, 0);
      }, true);
      // A failed client bootstrap can leave the root empty even when HTML/assets are 200.
      // Show a recovery action rather than an indefinitely blank or loading screen.
      window.setTimeout(function () {
        var root = document.getElementById("root");
        if (!root) return;
        var fallback = root.querySelector("#navilo-boot-fallback");
        var empty = !root.textContent || !root.textContent.trim();
        if (!fallback && !empty) return;
        root.innerHTML = '<div role="alert" style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:#f6f7f9;padding:24px;font:500 14px Inter,Arial,sans-serif;color:#334155"><div style="max-width:480px;border:1px solid #fecaca;background:white;padding:20px;border-radius:10px"><strong style="display:block;color:#991b1b;margin-bottom:8px">NAVILO did not finish opening</strong><p style="line-height:1.6;margin:0 0 14px">The app could not complete startup. Reload to get the latest version. Your saved business data has not been changed.</p><button type="button" onclick="window.location.reload()" style="background:#1e40af;color:white;border:0;border-radius:6px;padding:10px 16px;cursor:pointer">Reload NAVILO</button></div></div>';
      }, 14000);
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
