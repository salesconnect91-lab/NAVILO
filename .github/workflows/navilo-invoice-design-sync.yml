name: NAVILO invoice design sync

on:
  push:
    paths:
      - .github/workflows/navilo-invoice-design-sync.yml

permissions:
  contents: write

jobs:
  design-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Align consolidated invoice presentation only
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              if old not in text:
                  raise SystemExit(f"Missing expected pattern: {label}")
              return text.replace(old, new, 1)

          purchase_path = Path("src/modules/purchase/ConsolidatedPurchaseInvoices.tsx")
          purchase = purchase_path.read_text()
          purchase = replace_once(purchase, 'className="card mb-6 space-y-5 p-4 md:p-6"', 'className="navilo-consolidated-purchase-editor mb-6 space-y-3"', "purchase editor shell")
          purchase = purchase.replace('>+ Add Line / لائن شامل کریں</button>', '>+ Add Line</button>')
          purchase = purchase.replace('>Close / بند کریں</button>', '>Close</button>')
          purchase = replace_once(
              purchase,
              '<button type="button" className="btn-danger px-3 py-1.5 text-xs" onClick={() => removeLine(index)}>Remove Line / لائن حذف کریں</button>',
              '<button type="button" className="inline-flex h-8 w-8 items-center justify-center rounded-md text-lg leading-none text-rose-600 hover:bg-rose-50" onClick={() => removeLine(index)} aria-label="Remove line" title="Remove line">×</button>',
              "purchase compact remove action",
          )
          purchase = purchase.replace('Purchase Charges / خریداری چارجز', 'Applicable Charges')
          purchase = purchase.replace('Charge Master se Purchase/Both charges. Taxable charges par fixed VAT apply hota hai.', 'Rates and calculation basis come from Charge Master. Taxable charges use the configured fixed VAT rate.')
          purchase = purchase.replace('Subtotal / ذیلی مجموعہ', 'Direct Items')
          purchase = purchase.replace('Charges / چارجز', 'Charges')
          purchase = purchase.replace('Items VAT / آئٹمز ٹیکس', 'Items VAT')
          purchase = purchase.replace('Charges VAT / چارجز ٹیکس', 'Charge VAT')
          purchase = purchase.replace('Invoice Total / کل', 'Grand Total')
          purchase_path.write_text(purchase)

          sales_path = Path("src/modules/sales/ConsolidatedInvoices.tsx")
          sales = sales_path.read_text()
          sales = replace_once(
              sales,
              'return <div className="space-y-3">\n      <section className="flex flex-col gap-3 border-b border-slate-200 pb-3 xl:flex-row xl:items-center xl:justify-between">',
              'return <div className="navilo-consolidated-sales-editor space-y-3">\n      <section className="flex flex-col gap-3 border-b border-slate-200 pb-3 xl:flex-row xl:items-center xl:justify-between">',
              "sales editor shell",
          )
          sales = sales.replace('>Preview / Print</button>', '>Preview</button>')
          sales = sales.replace('>Document Type</label>', '>Invoice Type</label>')
          sales = sales.replace('>Dispatch No.</label>', '>Invoice No.</label>')
          sales = sales.replace('>Date</label>', '>Invoice Date</label>', 1)
          sales = sales.replace('>Dispatch Items</div>', '>Invoice Items</div>')
          sales = sales.replace('Every physical line requires a godown.', 'Item, description, godown, quantity, rate and fixed VAT')
          sales = sales.replace('Calculated from Charge Master; no hard-coded charge columns in the form.', 'Rates and calculation basis come from Charge Master.')
          sales = sales.replace('<span>Items</span>', '<span>Items Subtotal</span>')
          sales = sales.replace('<span className="font-semibold">Document Total</span>', '<span className="font-semibold">Grand Total</span>')
          sales_path.write_text(sales)

          css_path = Path("src/index.css")
          css = css_path.read_text()
          marker = "/* NAVILO consolidated invoice visual parity */"
          if marker not in css:
              css += """

          /* NAVILO consolidated invoice visual parity */
          #navilo-main-content:has(.navilo-consolidated-purchase-editor) [data-navilo-global-data-tools],
          #navilo-main-content:has(.navilo-consolidated-sales-editor) [data-navilo-global-data-tools] {
            display: none !important;
          }

          .navilo-consolidated-purchase-editor {
            border: 0 !important;
            background: transparent !important;
            box-shadow: none !important;
            padding: 0 !important;
          }

          .navilo-consolidated-purchase-editor > .flex:first-child,
          .navilo-consolidated-purchase-editor > .grid {
            border: 1px solid #e2e8f0;
            border-radius: 0.5rem;
            background: #fff;
            padding: 0.75rem;
          }

          .navilo-consolidated-purchase-editor > .overflow-x-auto,
          .navilo-consolidated-purchase-editor > .rounded-lg.border,
          .navilo-consolidated-purchase-editor > .flex.justify-end,
          .navilo-consolidated-purchase-editor > .flex.flex-wrap.justify-end,
          .navilo-consolidated-purchase-editor > .flex.flex-wrap.gap-2 {
            width: 92%;
            max-width: 1480px;
            margin-left: auto;
            margin-right: auto;
          }

          .navilo-consolidated-purchase-editor > .overflow-x-auto,
          .navilo-consolidated-purchase-editor > .rounded-lg.border {
            border: 1px solid #e2e8f0;
            border-radius: 0.5rem;
            background: #fff;
            padding: 0.75rem;
          }

          .navilo-consolidated-purchase-editor > .flex.justify-end > div,
          .navilo-consolidated-sales-editor > section {
            box-shadow: none !important;
          }

          .navilo-consolidated-sales-editor > section.rounded-lg,
          .navilo-consolidated-sales-editor > section.overflow-hidden {
            border-color: #e2e8f0;
            background: #fff;
          }

          .navilo-consolidated-sales-editor > section:nth-of-type(n+3) {
            width: 92%;
            max-width: 1480px;
            margin-left: auto;
            margin-right: auto;
          }

          .navilo-consolidated-sales-editor > section.ml-auto {
            margin-top: 0.75rem;
          }

          @media (max-width: 900px) {
            .navilo-consolidated-purchase-editor > .overflow-x-auto,
            .navilo-consolidated-purchase-editor > .rounded-lg.border,
            .navilo-consolidated-purchase-editor > .flex.justify-end,
            .navilo-consolidated-purchase-editor > .flex.flex-wrap.justify-end,
            .navilo-consolidated-purchase-editor > .flex.flex-wrap.gap-2,
            .navilo-consolidated-sales-editor > section:nth-of-type(n+3) {
              width: 100%;
            }
          }
          """
          css_path.write_text(css)
          PY

      - name: Commit presentation-only changes
        shell: bash
        run: |
          git config user.name "salesconnect91-lab"
          git config user.email "sales.connect91@gmail.com"
          git add src/modules/purchase/ConsolidatedPurchaseInvoices.tsx src/modules/sales/ConsolidatedInvoices.tsx src/index.css
          git rm .github/workflows/navilo-invoice-design-sync.yml
          git commit -m "Align consolidated invoice screens with NAVILO professional design"
          git push origin main
