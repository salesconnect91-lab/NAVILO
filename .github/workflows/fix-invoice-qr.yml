# Legacy one-shot QR patch is intentionally disabled.
# The former push trigger checked out main and pushed a generated change directly
# to production, bypassing the unified release gates. QR changes must instead
# be reviewed, tested and merged through the development release process.
name: Legacy invoice QR patch (disabled)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  notice:
    runs-on: ubuntu-latest
    steps:
      - name: Explain retired workflow
        run: |
          echo 'The legacy QR auto-patch is retired. Make QR fixes in source on the development branch and run the normal build/test workflow.'
