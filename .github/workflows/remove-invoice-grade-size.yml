name: Remove redundant invoice grade and size
on:
  push:
    paths:
      - '.github/workflows/remove-invoice-grade-size.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Remove redundant Grade and Size invoice columns
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('src/modules/sales/SalesInvoiceDetail.tsx')
          s = p.read_text()
          replacements = [
            ('    grade: line.grade ?? "",\n    size: line.size ?? "",\n', ''),
            ('    { key: "grade", label: "Grade / گریڈ" },\n    { key: "size", label: "Size / سائز" },\n', ''),
            ('<th className="px-2 py-2 text-left">Grade</th><th className="px-2 py-2 text-left">Size</th>', ''),
            ('<td className="px-2 py-2">{line.grade || "—"}</td><td className="px-2 py-2">{line.size || "—"}</td>', ''),
            ('colSpan={isTaxInvoice ? 8 : 7}', 'colSpan={isTaxInvoice ? 6 : 5}'),
            ('              grade: line.grade,\n              size: line.size,\n', ''),
          ]
          for old, new in replacements:
            if old not in s:
              raise SystemExit(f'Expected SalesInvoiceDetail pattern not found: {old[:80]!r}')
            s = s.replace(old, new, 1)
          p.write_text(s)

          p = Path('src/components/PrintLayout.tsx')
          s = p.read_text()
          replacements = [
            ('      ? "24px minmax(135px,1.05fr) minmax(115px,0.9fr) 70px 62px 82px 84px 98px"\n      : "24px minmax(165px,1.1fr) minmax(130px,0.95fr) 74px 68px 92px 106px",',
             '      ? "24px minmax(165px,1.15fr) minmax(135px,0.95fr) 68px 88px 86px 104px"\n      : "24px minmax(190px,1.2fr) minmax(150px,1fr) 72px 96px 112px",'),
            ('<div>#</div><div>Item / آئٹم</div><div>Description / تفصیل</div><div>Grade / گریڈ</div><div className="invoice-num">Qty / مقدار</div>',
             '<div>#</div><div>Item / آئٹم</div><div>Description / تفصیل</div><div className="invoice-num">Qty / مقدار</div>'),
            ('          <div>{item.grade ?? "—"}</div><div className="invoice-num">{item.qty}</div>',
             '          <div className="invoice-num">{item.qty}</div>'),
          ]
          for old, new in replacements:
            if old not in s:
              raise SystemExit(f'Expected PrintLayout pattern not found: {old[:80]!r}')
            s = s.replace(old, new, 1)
          p.write_text(s)
          PY
      - name: Commit fix
        run: |
          git config user.name "NAVILO Automation"
          git config user.email "actions@users.noreply.github.com"
          git add src/modules/sales/SalesInvoiceDetail.tsx src/components/PrintLayout.tsx
          git diff --cached --quiet && exit 0
          git commit -m "Remove redundant Grade and Size from invoice lines"
          git push origin main