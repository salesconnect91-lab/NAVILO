name: Expense Billing Acceptance
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/expense-billing-acceptance.yml'
      - 'supabase/migrations/**'
      - 'supabase/tests/transport_vehicle_accounting_expenses_rehearsal.sql'
      - 'supabase/tests/replay_transport_isolated.mjs'
      - 'src/modules/purchase/**'
      - 'src/modules/transport/TransportNormalInvoiceCreate.tsx'
      - 'src/modules/transport/TransportNormalInvoiceImport.tsx'
      - 'src/modules/transport/transportNormalInvoiceImport.ts'
permissions:
  contents: read
jobs:
  expense-reconciliation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: navilo_transport_rehearsal
          POSTGRES_PASSWORD: navilo-rehearsal-only
        ports:
          - 6543:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Install isolated PostgreSQL driver
        run: npm install --prefix "$RUNNER_TEMP/navilo-rehearsal-driver" --no-save --package-lock=false --no-audit --no-fund pg@8.16.3
      - name: Reconcile expense invoices with VAT, cash, bank, AP and vehicle ledgers
        env:
          NAVILO_NATIVE_REHEARSAL: '1'
          NAVILO_VEHICLE_EXPENSE_SMOKE: '1'
          NAVILO_PG_DRIVER: ${{ runner.temp }}/navilo-rehearsal-driver/node_modules/pg/lib/index.js
        run: node supabase/tests/replay_transport_isolated.mjs
