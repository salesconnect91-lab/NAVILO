name: Fix runtime freeze observers
on:
  push:
    paths:
      - '.github/workflows/fix-runtime-freeze-observers.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Remove high-frequency DOM observation
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/components/LanguageRuntime.tsx')
          s=p.read_text()
          old='observer.observe(document.body, { childList: true, subtree: true, characterData: true, attributes: true, attributeFilter: [...TRANSLATABLE_ATTRIBUTES] });'
          new='observer.observe(document.body, { childList: true, subtree: true });'
          if old not in s: raise SystemExit('LanguageRuntime observer signature not found')
          p.write_text(s.replace(old,new))

          p=Path('src/components/JurisdictionRuntime.tsx')
          s=p.read_text()
          old='observer.observe(document.body, { childList: true, subtree: true, characterData: true, attributes: true, attributeFilter: [...ATTRIBUTES] });'
          new='observer.observe(document.body, { childList: true, subtree: true });'
          if old not in s: raise SystemExit('JurisdictionRuntime observer signature not found')
          p.write_text(s.replace(old,new))
          PY
      - name: Verify build
        run: |
          npm ci
          npm run build
      - name: Commit repair
        run: |
          git config user.name 'NAVILO Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add src/components/LanguageRuntime.tsx src/components/JurisdictionRuntime.tsx
          git commit -m 'Stop high-frequency language runtime DOM observer loops'
          git push origin main
