name: Build

on:
  push:
    branches:
      - main
      - 'work/navilo-unified-release-audit-*'
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Clean install
        run: npm ci --no-audit --no-fund
      - name: Typecheck, tests and production build
        run: npm run check
